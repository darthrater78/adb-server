services:
  adb-server:
    build: ./adb-server
    networks: [internal]
    volumes:
      - adbkeys:/home/adb/.android
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    # No ports published — reachable only from `app`, over the internal compose
    # network. Never add `network_mode: host` here: the adb server binds all
    # interfaces inside its own container (needed so `app` can reach it), and
    # host networking would put that unauthenticated port directly on your LAN.

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    networks: [internal]
    depends_on: [adb-server]
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data
    env_file: .env
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Bound to all interfaces — reachable from your LAN over plain HTTP. This
    # is a deliberate, deferred trade-off, not an oversight: the login
    # password and session cookie travel in cleartext to anyone else on the
    # same network. If this stops being a "trusted home LAN" situation, put a
    # reverse proxy (Caddy, Tailscale serve) with TLS in front instead, and
    # go back to binding this to "127.0.0.1:8080:8080".

networks:
  internal:

volumes:
  adbkeys:
  appdata:
