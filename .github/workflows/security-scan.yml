name: Security scan

# Weekly, over what is already released: advisories published after a release
# don't show up in its own checks. It never blocks anything; a failed run (or
# a new alert in the Security tab) is the report. Fixing one is a new release.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: true

jobs:
  images:
    name: Scan the published ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [adb-server, app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest stable version tag, never a floating :latest.
      - name: Find the newest release
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | { grep -v -- '-' || true; } | head -n1)"
          if [ -z "$tag" ]; then
            echo "::error::No release tag yet, so there is no published image to scan."
            exit 1
          fi
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}:${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.74.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload scan to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-weekly-${{ matrix.image }}

  python:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pip-audit on the default branch's lockfiles
        run: |
          set -euo pipefail
          python3 -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet --disable-pip-version-check pip-audit==2.10.1
          # The dev lockfile holds every package the app image installs, plus pytest.
          /tmp/audit/bin/pip-audit --requirement requirements-dev.txt --require-hashes --strict
