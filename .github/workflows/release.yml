name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in flight.
  cancel-in-progress: false

jobs:
  # A commit reaching the default branch proves only that it was merged — not
  # that CI ever ran against it, let alone passed. This job checks both before
  # anything is built or published.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A dev build (v3.7.0-dev.1) may come from a branch: it publishes
          # images under its own full version only, never :latest or :X.Y, and
          # its GitHub release is a pre-release (see the publish job).
          case "$GITHUB_REF_NAME" in
            *-*) echo "Pre-release tag $GITHUB_REF_NAME: any branch may build it."; exit 0 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH. Releases come from the default branch only."
            exit 1
          fi

      - name: Verify VERSION matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # v3.7.0-dev.1 is a build of the 3.7.0 in VERSION.
          version="${version%%-*}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "::error::Tag $TAG does not match VERSION ($file_version). Bump VERSION and re-tag."
            exit 1
          fi

      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Tagging right after pushing the branch is normal and CI takes
          # minutes, so an in-progress run is waited on rather than treated as
          # a failure. This never runs CI itself — it asks the API whether
          # ci.yml already passed for this exact commit.
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            runs=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')

            if [ -z "$runs" ]; then
              echo "::error::CI has never run for ${SHA}, so nothing has tested this commit."
              echo "Push the branch so CI runs on it, or dispatch it by hand" >&2
              echo "(Actions -> CI -> Run workflow), then re-tag." >&2
              exit 1
            fi

            if printf '%s\n' "$runs" | awk '$2 == "success" { hit = 1 } END { exit !hit }'; then
              echo "CI passed for ${SHA}."
              exit 0
            fi

            unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
            if [ "$unfinished" -eq 0 ]; then
              echo "::error::CI ran for ${SHA} and did not pass. Refusing to release."
              printf '%s\n' "$runs" | sed 's/^/  /' >&2
              exit 1
            fi

            echo "CI is still running for ${SHA} (${unfinished} unfinished) -- waiting."
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI on ${SHA} to finish."
              exit 1
            fi
            sleep 20
          done

  images:
    name: Publish ${{ matrix.image }} image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write  # the scan's report, for the Security tab
      id-token: write         # signs the build provenance attestation
      attestations: write     # stores it
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: adb-server
            context: .  # the repo root: the image copies VERSION
            dockerfile: ./adb-server/Dockerfile
            version_file: /etc/adb-server-version
          - image: app
            context: .
            dockerfile: ./app/Dockerfile
            version_file: /app/VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this build may claim :latest
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Nothing about a tag push says it is the newest version: backfilling
          # a skipped release, or re-tagging an old commit, would otherwise move
          # :latest backward and silently downgrade whoever pulls it. These tags
          # come from this run's own fresh clone (fetch-depth: 0), not a stale
          # working copy, so they are current.
          version="${TAG#v}"
          case "$version" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT"
                 echo "prerelease=true" >> "$GITHUB_OUTPUT"
                 echo "$version is a prerelease — not touching :latest."
                 exit 0 ;;
          esac
          # Stable versions compare against stable versions only: a plain
          # sort -V puts 1.0.0 before 1.0.0-dev.2, which is right for neither.
          newest="$(git tag -l 'v*' | sed 's/^v//' | { grep -v -- '-' || true; } | sort -V | tail -n1)"
          if [ "$version" = "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$version is not the newest stable version ($newest) — not moving :latest."
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Stamp the tag's full version into VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # VERSION says 3.7.0 for v3.7.0-dev.1 too (the gate checks only the
          # part before the dash). Both images publish VERSION, and the app
          # compares the two, so a dev build must report itself as one:
          # otherwise a 3.7.0-dev.1 app beside a 3.7.0 adb-server looks matched.
          printf '%s\n' "${TAG#v}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registries need a lowercase name; the owner may not be.
      - name: Image name
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=${{ steps.channel.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Pushed by digest only: no version tag points at it until it passes
      # the scan below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Two runs over the same digest. This one never fails: it writes the
      # report for the repo's Security tab.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload scan to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

      # This run is the gate: a fixable HIGH or CRITICAL stops the release
      # here, before any version tag exists (trivy.yaml says what counts).
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          skip-setup-trivy: true
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'

      # A signed record, stored with the image, that this workflow built this
      # digest from this commit: `gh attestation verify oci://<image>:<tag>
      # --repo darthrater78/adb-server` checks it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Tag the scanned image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      # What was published is what was scanned: every tag resolves to the
      # scanned digest, and the image reports the version it was tagged with.
      - name: Verify the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG: ${{ github.ref_name }}
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$tag points at $got, not the scanned $DIGEST."
              exit 1
            fi
            echo "$tag -> $got"
          done <<< "$TAGS"
          want="${TAG#v}"
          reported="$(docker run --rm --pull always --entrypoint cat "${IMAGE}:${want}" "$VERSION_FILE" | tr -d '[:space:]')"
          if [ "$reported" != "$want" ]; then
            echo "::error::${IMAGE}:${want} reports version '$reported'."
            exit 1
          fi
          echo "${IMAGE}:${want} reports $reported."

  publish:
    name: Create GitHub release
    needs: [gate, images]
    # A dev build (any tag with a -suffix) gets a GitHub pre-release: it never
    # becomes "Latest", and the README's banner (dev-banner.yml) is drawn
    # from it until the release it leads to ships.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # A dev build's changes are under the version it leads to: 3.9.0
          # for v3.9.0-dev.1.
          section="${version%%-*}"
          # Matches this project's heading style (`## 0.2.0 — 2026-09-16`) and
          # the bracketed Keep-a-Changelog style, without matching 0.2.0 when
          # looking for 0.2.
          awk -v v="$section" '
            function esc(s) { gsub(/[.]/, "\\.", s); return s }
            BEGIN { pat = "^## \\[?" esc(v) "\\]?([^0-9.]|$)" }
            matched && /^## / { exit }
            $0 ~ pat { matched = 1; next }
            matched { print }
          ' CHANGELOG.md > notes.md
          notes="$(sed -e '/./,$!d' notes.md)"
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section found for $section."
            notes="Release $version"
          fi
          # The backticks below are literal Markdown code spans in the release
          # notes, which is exactly why these format strings are single-quoted.
          # shellcheck disable=SC2016
          {
            # The first paragraph of a dev build's notes is what the README
            # banner shows (scripts/dev_banner.py).
            case "$version" in
              *-*) printf 'Dev build of %s from a branch that has not merged yet, for testing. Images only: `:latest` does not move.\n\n' "$section" ;;
            esac
            printf '%s\n\n' "$notes"
            printf '### Container images\n\n'
            printf -- '- `ghcr.io/%s/adb-server:%s`\n' "$REPO" "$version"
            printf -- '- `ghcr.io/%s/app:%s`\n' "$REPO" "$version"
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One tag push can start two runs (seen on v3.4.0); the concurrency
          # group queues the second, which then finds the release made.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          # The tag name arrives as a variable, never spliced into this script.
          args=()
          case "${TAG#v}" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${args[@]}"
