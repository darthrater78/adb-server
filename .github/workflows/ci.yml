name: CI

# Every branch push, so feature branches are tested before they reach a PR,
# and every PR.
on:
  push:
    branches: ['**']
  pull_request:
  # release.yml refuses to publish a commit CI never passed on; this is the
  # escape hatch that gate points at.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: VERSION and CHANGELOG agree
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          # First real version heading — an "## Unreleased" section is a
          # normal in-progress state, not a mismatch.
          heading="$(grep '^## ' CHANGELOG.md | grep -viE '^## \[?unreleased\]?' | head -1)"
          case "$heading" in
            "## $version"*|"## [$version]"*)
              echo "VERSION $version matches newest changelog heading: $heading" ;;
            *)
              echo "::error::VERSION says $version but the newest CHANGELOG.md heading is '$heading'."
              exit 1 ;;
          esac

      - name: Validate compose file
        run: |
          set -euo pipefail
          # `env_file: .env` is resolved when compose parses the file, even for
          # a config-only run, so the file has to exist.
          cp .env.example .env
          docker compose config --quiet

      - name: Audit Python dependencies
        run: |
          set -euo pipefail
          # A venv: the runner's system python is externally managed (PEP 668).
          python3 -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet --disable-pip-version-check pip-audit==2.10.1
          # requirements-dev.txt includes app/ and mdns/requirements.txt.
          /tmp/audit/bin/pip-audit --requirement requirements-dev.txt --strict

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'  # matches the app image's base
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            mdns/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: bash scripts/test.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: app/Dockerfile
          - name: adb-server
            context: adb-server
            file: adb-server/Dockerfile
          - name: mdns
            context: mdns
            file: mdns/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: adb-server-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
