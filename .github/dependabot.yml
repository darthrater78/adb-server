version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/mdns"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"  # requirements-dev.txt
    schedule:
      interval: "weekly"

  # Base image digests in every Dockerfile.
  - package-ecosystem: "docker"
    directories: ["/app", "/adb-server", "/mdns"]
    schedule:
      interval: "weekly"
