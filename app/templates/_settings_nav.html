<nav class="settings-nav" aria-label="Settings">
  <a href="/settings"{% if settings_page == "overview" %} aria-current="page"{% endif %}>Overview</a>
  {% for slug, label in [("general", "General"), ("security", "Security"), ("notifications", "Notifications"), ("github", "GitHub"), ("appearance", "Appearance")] %}

  {% endfor %}
</nav>
