{# Flashbang / Dark / OLED, kept per browser in a cookie. In the top bar on
   wide screens, and on Settings → Appearance (the only place on phones). #}
<div class="theme-switcher" role="group" aria-label="Theme">
  {% for t, label in [("flashbang", "Flashbang"), ("dark", "Dark"), ("oled", "OLED")] %}
  <form method="post" action="/theme" class="theme-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ current_path }}">
    <input type="hidden" name="theme" value="{{ t }}">
    <button type="submit" class="theme-btn{{ ' active' if theme == t else '' }}"{% if theme == t %} aria-pressed="true"{% endif %}>{{ label }}</button>
  </form>
  {% endfor %}
</div>
