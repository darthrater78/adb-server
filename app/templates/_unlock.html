{# The sign-in button, drawn as the Holo unlock ring. `unlock_label` names it. #}
<button type="submit" class="unlock">
  <span class="unlock-halo" aria-hidden="true"><span class="unlock-ring"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="1.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></span></span>
  {{ unlock_label | default("Sign in") }}
</button>
