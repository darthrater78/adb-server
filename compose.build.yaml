# Build both images from this checkout instead of pulling them:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  adb-server:
    image: adb-server-local/adb-server
    build:
      context: ./adb-server

  app:
    image: adb-server-local/app
    build:
      context: .
      dockerfile: app/Dockerfile
